name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # The build fails if a Node-only module reaches the browser payload. The
      # guard reads the emitted module graph (scripts/bundleGuard.mjs) and prints a
      # one-line summary, so a passing log is evidence it ran rather than stayed
      # silent. Its own failure modes are covered by src/bundleGuard.build.test.js.
      - name: Build (includes the production bundle guard)
        run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown
      # The committed package's bytes are whatever the generator wrote, so the
      # checker has to run the generator that wrote them. `latest` silently means
      # a newer wasm-pack (0.15 and counting) rewrites the .wasm and the
      # package.json of a package that is otherwise current, and the drift check
      # then fails on a commit that changed no Rust at all. Bump this and
      # regenerate src/wasm-pkg in the same commit; `--locked` keeps the
      # toolchain's own dependency resolution out of the picture.
      - run: cargo install wasm-pack --version 0.13.1 --locked
      - run: npm ci
      - name: Rust unit tests
        run: cargo test --manifest-path rust-engine/Cargo.toml
      # The committed package's bytes are not comparable here: the same Rust
      # source compiles to a module with slightly different function numbering
      # on macOS and on Linux, so a byte diff says nothing about whether the
      # package is current. What CI can check is that the package was built from
      # this source — the build records a hash of its inputs (scripts/
      # wasmSourceHash.mjs) and this compares it.
      - name: Committed package matches the Rust source
        run: node scripts/wasmSourceHash.mjs --check
      # `npm run build:wasm` is rust-engine/build.sh: it builds through wasm-pack,
      # restores the curated src/wasm-pkg/.gitignore that wasm-pack overwrites
      # with a bare `*`, drops the generator-stamped producers section and stamps
      # the source hash. A green run means the engine still builds as shipped.
      - name: Rebuild the package
        run: npm run build:wasm
