name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # The build fails if a Node-only module reaches the browser payload. The
      # guard reads the emitted module graph (scripts/bundleGuard.mjs) and prints a
      # one-line summary, so a passing log is evidence it ran rather than stayed
      # silent. Its own failure modes are covered by src/bundleGuard.build.test.js.
      - name: Build (includes the production bundle guard)
        run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown
      # The committed package's bytes are whatever the generator wrote, so the
      # checker has to run the generator that wrote them. `latest` silently means
      # a newer wasm-pack (0.15 and counting) rewrites the .wasm and the
      # package.json of a package that is otherwise current, and the drift check
      # then fails on a commit that changed no Rust at all. Bump this and
      # regenerate src/wasm-pkg in the same commit; `--locked` keeps the
      # toolchain's own dependency resolution out of the picture.
      - run: cargo install wasm-pack --version 0.13.1 --locked
      - run: npm ci
      - name: Rust unit tests
        run: cargo test --manifest-path rust-engine/Cargo.toml
      # `npm run build:wasm` is rust-engine/build.sh: it builds through wasm-pack
      # and restores the curated src/wasm-pkg/.gitignore that wasm-pack overwrites
      # with a bare `*`. Running wasm-pack directly here used to leave that one
      # file dirty and fail the drift check by itself.
      - name: WASM artifact must match Rust source
        run: |
          npm run build:wasm
          git diff --exit-code -- src/wasm-pkg || (echo "::error::src/wasm-pkg is stale — rebuild in the same commit (see README Rust WebAssembly)" && exit 1)
      - name: Upload the rebuilt package when the check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-rebuilt
          path: src/wasm-pkg/
