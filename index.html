<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f2ed" />
    <meta
      name="description"
      content="混凝土徐变多模型平台，集成ACI209、MC2010、B4、B4S等主流模型，支持批量导入导出、可视化，适用于科研与工程设计。"
    />
    <meta name="keywords" content="混凝土,徐变,ACI209,MC2010,B4,B4S,工程计算,批量导入,科研工具,结构设计,土木工程" />
    <meta name="author" content="halunhaku" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>CREEP LAB | Concrete creep calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      (function () {
        function applyTheme(theme) {
          localStorage.setItem('theme-mode', theme);
          document.body.setAttribute('data-theme', theme);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#101412' : '#f4f2ed');
        }
        window.toggleTheme = function () {
          applyTheme(document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        };
        applyTheme(localStorage.getItem('theme-mode') === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
