<!DOCTYPE html>
<!-- translate="no": the interface is a bilingual technical tool with its own
     language switch, and machine translation reliably mangles identifiers such as
     ACI 209R-92, J(t,t′) and the parameter names. lang="en" is the static default
     for a visitor whose browser asks for neither shipped language, and for the
     moment before the script at the end of the body picks the reader's own. -->
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) reports the real insets when
         the app is installed and there is no browser chrome. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="混凝土徐变多模型平台，集成ACI209、MC2010、B4、B4S等主流模型，支持批量导入导出、可视化，适用于科研与工程设计。"
    />
    <meta name="keywords" content="混凝土,徐变,ACI209,MC2010,B4,B4S,工程计算,批量导入,科研工具,结构设计,土木工程" />
    <meta name="author" content="halunhaku" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>CREEP LAB | Concrete creep calculator</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      (function () {
        function applyTheme(theme) {
          localStorage.setItem('theme-mode', theme);
          document.documentElement.setAttribute('data-theme', theme);
          document.body.setAttribute('data-theme', theme);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#161616' : '#ffffff');
        }
        window.toggleTheme = function () {
          applyTheme(document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        };
        applyTheme(localStorage.getItem('theme-mode') === 'dark' ? 'dark' : 'light');
      })();

      // `lang` on <html> is what a screen reader takes its phonemes from, so it has
      // to be right before the first paint, not one React render later. The stored
      // choice wins; otherwise a Chinese browser preference gets Chinese. Only the
      // attribute is set here — the title and the description are the English head
      // below until React mounts, because duplicating translated copy into this file
      // would be a second place to keep in step for no accessibility gain.
      (function () {
        var stored, languages, index;
        try {
          stored = localStorage.getItem('creep-lab:locale');
          if (stored !== 'zh' && stored !== 'en') {
            stored = null;
            languages = navigator.languages || [navigator.language || ''];
            for (index = 0; index < languages.length; index += 1) {
              if (String(languages[index]).toLowerCase().indexOf('zh') === 0) { stored = 'zh'; break; }
            }
          }
          if (stored) document.documentElement.lang = stored === 'zh' ? 'zh-CN' : 'en';
        } catch (error) {
          // storage blocked — the lang="en" in the markup stands
        }
      })();
    </script>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
